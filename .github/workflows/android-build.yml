name: Android CI/CD

on:
  push:
    branches: [ "main", "master", "develop", "release/**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:
    inputs:
      build_release_bundle:
        description: 'Build Android App Bundle (.aab)'
        required: false
        default: true
        type: boolean
      run_tests:
        description: 'Run Unit Tests'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish to GitHub Releases'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Custom tag name for release (leave blank for auto)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: write

jobs:
  build:
    name: Build & Package VDOFLY
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Configure Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          # 1. Restore debug keystore from base64 if present, else generate
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 2. Setup release keystore from secrets if provided, else generate with matching passwords
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=VDOFLY,C=US"
          fi

      - name: Run Unit Tests
        if: ${{ github.event.inputs.run_tests != 'false' }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Results
        if: always() && github.event.inputs.run_tests != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: VDOFLY-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release Bundle (AAB)
        if: ${{ github.event.inputs.build_release_bundle != 'false' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VDOFLY-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VDOFLY-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release Bundle (AAB)
        if: ${{ github.event.inputs.build_release_bundle != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: VDOFLY-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || format('VDOFLY v1.0.{0} Release', github.run_number) }}
          body: |
            ## VDOFLY Android Release
            
            ### Included Assets:
            - **Release APK**: Signed production APK for direct device installation
            - **Debug APK**: Debug build for testing and diagnostics
            - **Android App Bundle (AAB)**: Production bundle for Google Play Store distribution
            
            *Build: ${{ github.run_number }} (${{ github.sha }})*
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false
          make_latest: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

